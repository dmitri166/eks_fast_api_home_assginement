# =============================================================================
# Terraform CI/CD — Separate workflow for infrastructure changes
# =============================================================================

name: Terraform

on:
  pull_request:
    branches: [master]
    paths:
      - "terraform/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: "1.9.0"
  WORKING_DIR: terraform

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Plan (dry-run)
        if: github.event_name == 'pull_request'
        run: |
          terraform plan \
            -var-file=environments/dev/dev.tfvars \
            -no-color \
            -input=false \
            2>&1 | tee /tmp/plan.txt || true
          # Expected to fail without AWS credentials — this is a dry-run demo
        working-directory: ${{ env.WORKING_DIR }}

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8');
            const output = `#### Terraform Plan
            \`\`\`
            ${plan.substring(0, 65000)}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # Manual approval gate for production apply
      # - name: Terraform Apply
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   run: terraform apply -auto-approve -var-file=environments/dev/dev.tfvars
      #   working-directory: ${{ env.WORKING_DIR }}

      - name: Security Scan (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          soft_fail: true
