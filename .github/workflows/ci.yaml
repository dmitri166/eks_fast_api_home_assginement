# =============================================================================
# CI/CD Pipeline — GitHub Actions
# =============================================================================
# Stages: Lint → Test → Build → Scan → Deploy (via ArgoCD image update)
# =============================================================================

name: CI/CD Pipeline

on:
  pull_request:
    branches: [master]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fastapi-app
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read
  id-token: write          # For AWS OIDC authentication
  security-events: write   # For uploading SARIF results
  pull-requests: write     # For PR comments

jobs:
  # =========================================================================
  # Stage 1: Lint
  # =========================================================================
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint Python (ruff)
        run: |
          pip install ruff
          ruff check app/
          ruff format --check app/

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

      - name: Lint Helm chart
        run: |
          helm lint helm/fastapi-app/


  # =========================================================================
  # Stage 2: Test
  # =========================================================================
  test:
    name: "Test"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run tests with coverage
        run: |
          cd app
          pytest tests/ -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=75 \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/test-results.xml
            app/coverage.xml

  # =========================================================================
  # Stage 3: Build
  # =========================================================================
  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # In production, uncomment and configure AWS credentials:
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::123456789012:role/github-actions
      #     aws-region: ${{ env.AWS_REGION }}
      #
      # - name: Login to ECR
      #   id: ecr-login
      #   uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: build
        run: |
          cd app
          docker build \
            --tag fastapi-app:${{ env.IMAGE_TAG }} \
            --tag fastapi-app:latest \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            .
          echo "image_uri=fastapi-app:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

      - name: Save image for scanning
        run: |
          docker save fastapi-app:${{ env.IMAGE_TAG }} -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # =========================================================================
  # Stage 4: Security Scan
  # =========================================================================
  scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Scan container image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "fastapi-app:${{ env.IMAGE_TAG }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "0"  # Don't fail on base image CVEs; SARIF upload provides visibility

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      - name: Scan Kubernetes manifests (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: helm/
          framework: kubernetes
          soft_fail: true  # Helm templates may have false positives
          output_format: cli

  # =========================================================================
  # Stage 5: Deploy (ArgoCD image update)
  # =========================================================================
  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'  # Won't trigger on PR-only; kept as production reference
    environment: production
    steps:
      - uses: actions/checkout@v4

      # In a real setup, this would push to ECR and update the ArgoCD Application
      # For this demo, we show the dry-run approach
      - name: Render Helm template (dry-run)
        run: |
          helm template fastapi-app helm/fastapi-app/ \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --namespace fastapi-app \
            > /tmp/rendered-manifests.yaml

          echo "Rendered manifests:"
          cat /tmp/rendered-manifests.yaml | head -50
          echo "..."
          echo "Total lines: $(wc -l < /tmp/rendered-manifests.yaml)"

      # In production, use argocd-image-updater or:
      # - name: Update ArgoCD Application image
      #   run: |
      #     argocd app set fastapi-app \
      #       --parameter image.tag=${{ env.IMAGE_TAG }} \
      #       --grpc-web

      - name: Deploy summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | production |" >> $GITHUB_STEP_SUMMARY
          echo "| Method | ArgoCD GitOps |" >> $GITHUB_STEP_SUMMARY
